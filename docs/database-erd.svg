<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1320" viewBox="0 0 1900 1320" role="img" aria-labelledby="title description">
  <title id="title">KajoRecSys database ERD and data flow</title>
  <desc id="description">Entity relationship diagram showing the application's users table with separate Teacher, Student, and Guidance counselor role labels, slip information, referrals, submissions, appointments, supporting records, and key foreign-key relationships.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 32px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 15px; fill: #475569; }
      .table { fill: #fff; stroke: #94a3b8; stroke-width: 1.5; rx: 12; }
      .head { fill: #dbeafe; }
      .head-green { fill: #dcfce7; }
      .head-purple { fill: #ede9fe; }
      .head-amber { fill: #fef3c7; }
      .head-slate { fill: #e2e8f0; }
      .role-chip { stroke: #94a3b8; stroke-width: 1; rx: 7; }
      .role-text { font-size: 13px; font-weight: 600; }
      .name { font-size: 19px; font-weight: 700; }
      .field { font-size: 14px; }
      .muted { font-size: 12px; fill: #475569; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .edge-dash { fill: none; stroke: #8b5cf6; stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .edge-label { font-size: 12px; font-weight: 600; fill: #475569; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
      .flow { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; }
      .flow-title { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .flow-text { font-size: 14px; fill: #334155; }
      .flow-arrow { fill: none; stroke: #16a34a; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1900" height="1320" fill="#f1f5f9"/>
  <text x="55" y="58" class="title">KajoRecSys — Database ERD &amp; Data Flow</text>
  <text x="55" y="88" class="subtitle">Sensitive fields encrypted · passwords one-way hashed · keyed HMACs support lookups · the same APP_KEY is required to decrypt</text>

  <!-- Relationships are drawn behind the tables. -->
  <path class="edge" d="M610 270 C560 270 520 230 440 230"/>
  <text x="493" y="235" class="edge-label">user_id</text>
  <path class="edge" d="M610 340 C550 370 510 405 440 420"/>
  <text x="496" y="390" class="edge-label">approved_by</text>
  <path class="edge" d="M610 690 C540 690 510 405 440 405"/>
  <text x="493" y="650" class="edge-label">user_id</text>
  <path class="edge" d="M1190 305 C1070 245 970 205 440 205"/>
  <text x="940" y="205" class="edge-label">assigned_by</text>
  <path class="edge" d="M1190 380 C1050 420 900 440 440 440"/>
  <text x="943" y="426" class="edge-label">student_id</text>
  <path class="edge" d="M1190 465 C1125 455 1080 330 1030 315"/>
  <text x="1070" y="392" class="edge-label">slip_submission_id</text>
  <path class="edge" d="M1190 510 C1120 515 1080 445 1030 430"/>
  <text x="1082" y="485" class="edge-label">slip_information_id</text>
  <path class="edge" d="M1440 220 C1440 155 1390 140 1320 140"/>
  <text x="1448" y="176" class="edge-label">related_assignment_id</text>
  <path class="edge" d="M1490 640 C1490 700 1490 720 1490 760"/>
  <text x="1500" y="716" class="edge-label">referral_id</text>
  <path class="edge" d="M1190 850 C1060 900 940 920 440 920"/>
  <text x="920" y="904" class="edge-label">user_id / reviewed_by</text>
  <path class="edge-dash" d="M250 500 C250 550 250 590 250 650"/>
  <text x="262" y="580" class="edge-label">roster import / matching by ID</text>
  <path class="edge" d="M440 275 C500 285 525 990 610 1010"/>
  <text x="465" y="955" class="edge-label">user_id</text>
  <path class="edge-dash" d="M440 300 C485 305 530 245 610 245"/>
  <text x="486" y="280" class="edge-label">user_id</text>
  <path class="edge-dash" d="M440 320 C500 370 535 1140 610 1140"/>
  <text x="488" y="1110" class="edge-label">notifiable (polymorphic)</text>

  <!-- users -->
  <g>
    <rect class="table" x="60" y="150" width="380" height="390"/>
    <path class="head-green" d="M72 150 H428 Q440 150 440 162 V194 H60 V162 Q60 150 72 150 Z"/>
    <text class="name" x="82" y="180">users</text>
    <text class="field" x="82" y="220">PK  id</text>
    <text class="field" x="82" y="246">name, email, id_number [encrypted]</text>
    <text class="field" x="82" y="272">gender [encrypted], password [hashed]</text>
    <text class="field" x="82" y="298">is_active, is_graduated</text>
    <text class="field" x="82" y="324">email_verified_at</text>
    <text class="field" x="82" y="350">must_change_password</text>
    <text class="field" x="82" y="376">two_factor_* , remember_token</text>
    <text class="field" x="82" y="402">name/email/id_number_lookup_hash [HMAC]</text>
    <text class="field" x="82" y="428">created_at, updated_at</text>
    <text class="muted" x="82" y="458">role (one value per account):</text>
    <rect class="role-chip head-green" x="82" y="470" width="100" height="32"/>
    <text class="role-text" x="98" y="491">Teacher</text>
    <rect class="role-chip head-amber" x="190" y="470" width="100" height="32"/>
    <text class="role-text" x="208" y="491">Student</text>
    <rect class="role-chip head-purple" x="298" y="470" width="125" height="32"/>
    <text class="role-text" x="306" y="491">Guidance counselor</text>
    <text class="muted" x="82" y="524">Role labels only; all accounts share this table.</text>
  </g>

  <!-- slip information -->
  <g>
    <rect class="table" x="610" y="120" width="420" height="340"/>
    <path class="head-purple" d="M622 120 H1018 Q1030 120 1030 132 V164 H610 V132 Q610 120 622 120 Z"/>
    <text class="name" x="632" y="150">slip_informations</text>
    <text class="field" x="632" y="190">PK  id</text>
    <text class="field" x="632" y="216">FK  user_id → users.id</text>
    <text class="field" x="632" y="242">FK  approved_by → users.id</text>
    <text class="field" x="632" y="268">full_name, student_id, email, phone</text>
    <text class="field" x="632" y="294">degree, year_level, school_year</text>
    <text class="field" x="632" y="320">purpose, purpose_other</text>
    <text class="field" x="632" y="346">review_status, approved_at</text>
    <text class="field" x="632" y="372">pdf_path, created_at, updated_at</text>
    <text class="muted" x="632" y="424">Personal/form fields are encrypted at rest</text>
  </g>

  <!-- passkeys -->
  <g>
    <rect class="table" x="610" y="500" width="420" height="210"/>
    <path class="head-slate" d="M622 500 H1018 Q1030 500 1030 512 V544 H610 V512 Q610 500 622 500 Z"/>
    <text class="name" x="632" y="530">passkeys</text>
    <text class="field" x="632" y="570">PK  id</text>
    <text class="field" x="632" y="596">FK  user_id → users.id</text>
    <text class="field" x="632" y="622">name, credential_id, credential</text>
    <text class="field" x="632" y="648">last_used_at, timestamps</text>
    <text class="muted" x="632" y="684">Account authentication devices</text>
  </g>

  <!-- slip submissions -->
  <g>
    <rect class="table" x="610" y="760" width="420" height="270"/>
    <path class="head-purple" d="M622 760 H1018 Q1030 760 1030 772 V804 H610 V772 Q610 760 622 760 Z"/>
    <text class="name" x="632" y="790">slip_submissions</text>
    <text class="field" x="632" y="830">PK  id</text>
    <text class="field" x="632" y="856">FK  user_id → users.id</text>
    <text class="field" x="632" y="882">FK  approved_by → users.id</text>
    <text class="field" x="632" y="908">slip, data [encrypted]</text>
    <text class="field" x="632" y="934">pdf_path, review_status</text>
    <text class="field" x="632" y="960">approved_at, timestamps</text>
    <text class="muted" x="632" y="1004">Submission payload contains form answers</text>
  </g>

  <!-- student references -->
  <g>
    <rect class="table" x="60" y="650" width="380" height="240"/>
    <path class="head-amber" d="M72 650 H428 Q440 650 440 662 V694 H60 V662 Q60 650 72 650 Z"/>
    <text class="name" x="82" y="680">student_references</text>
    <text class="field" x="82" y="720">PK  id</text>
    <text class="field" x="82" y="746">id_number [encrypted, unique by HMAC]</text>
    <text class="field" x="82" y="772">name, gender, year, course [encrypted]</text>
    <text class="field" x="82" y="798">id_number_lookup_hash [HMAC]</text>
    <text class="field" x="82" y="824">source_data [encrypted JSON]</text>
    <text class="field" x="82" y="850">created_at, updated_at</text>
    <text class="muted" x="82" y="878">Imported roster; no FK to users</text>
  </g>

  <!-- session logs -->
  <g>
    <rect class="table" x="60" y="960" width="380" height="250"/>
    <path class="head-slate" d="M72 960 H428 Q440 960 440 972 V1004 H60 V972 Q60 960 72 960 Z"/>
    <text class="name" x="82" y="990">account_session_logs</text>
    <text class="field" x="82" y="1030">PK  id · FK  user_id → users.id</text>
    <text class="field" x="82" y="1056">session_hash [unique hash]</text>
    <text class="field" x="82" y="1082">device_name, latitude, longitude [encrypted]</text>
    <text class="field" x="82" y="1108">logged_in_at, last_activity_at</text>
    <text class="field" x="82" y="1134">logged_out_at, timestamps</text>
    <text class="muted" x="82" y="1180">Account activity and device history</text>
  </g>

  <!-- slip assignments -->
  <g>
    <rect class="table" x="1190" y="220" width="600" height="440"/>
    <path class="head-green" d="M1202 220 H1778 Q1790 220 1790 232 V264 H1190 V232 Q1190 220 1202 220 Z"/>
    <text class="name" x="1212" y="250">slip_assignments</text>
    <text class="field" x="1212" y="292">PK  id</text>
    <text class="field" x="1212" y="318">FK  assigned_by → users.id</text>
    <text class="field" x="1212" y="344">FK  student_id → users.id</text>
    <text class="field" x="1212" y="370">FK  related_assignment_id → slip_assignments.id</text>
    <text class="field" x="1212" y="396">FK  slip_submission_id → slip_submissions.id</text>
    <text class="field" x="1212" y="422">FK  slip_information_id → slip_informations.id</text>
    <text class="field" x="1212" y="448">FK  approved_by → users.id</text>
    <text class="field" x="1212" y="474">slip, status, bundle_id</text>
    <text class="field" x="1212" y="500">notes [encrypted: teacher private comment]</text>
    <text class="field" x="1212" y="526">guidance_notes [encrypted: Guidance-only]</text>
    <text class="field" x="1212" y="552">completed_at, approved_at</text>
    <text class="field" x="1212" y="578">teacher_acknowledged_at, student_sent_to_teacher_at</text>
    <text class="field" x="1212" y="604">created_at, updated_at</text>
    <text class="muted" x="1212" y="640">Referral workflow: Teacher → Student → Guidance</text>
  </g>

  <!-- appointments -->
  <g>
    <rect class="table" x="1190" y="760" width="600" height="360"/>
    <path class="head-purple" d="M1202 760 H1778 Q1790 760 1790 772 V804 H1190 V772 Q1190 760 1202 760 Z"/>
    <text class="name" x="1212" y="790">appointments</text>
    <text class="field" x="1212" y="832">PK  id · FK  user_id → users.id</text>
    <text class="field" x="1212" y="858">FK  reviewed_by → users.id</text>
    <text class="field" x="1212" y="884">FK  referral_id → slip_assignments.id</text>
    <text class="field" x="1212" y="910">scheduled_at, duration_minutes, status</text>
    <text class="field" x="1212" y="936">purpose, concerns [encrypted]</text>
    <text class="field" x="1212" y="962">decline_reason, guidance_message [encrypted]</text>
    <text class="field" x="1212" y="988">reschedule_reason, action_taken [encrypted]</text>
    <text class="field" x="1212" y="1014">attachments [encrypted]</text>
    <text class="field" x="1212" y="1040">reviewed_at, completed_at, timestamps</text>
    <text class="muted" x="1212" y="1090">Counseling appointments and recorded outcomes</text>
  </g>

  <!-- notifications -->
  <g>
    <rect class="table" x="610" y="1080" width="420" height="160"/>
    <path class="head-slate" d="M622 1080 H1018 Q1030 1080 1030 1092 V1124 H610 V1092 Q610 1080 622 1080 Z"/>
    <text class="name" x="632" y="1110">notifications</text>
    <text class="field" x="632" y="1150">PK  uuid · notifiable_type / notifiable_id</text>
    <text class="field" x="632" y="1176">type, data [encrypted], read_at, timestamps</text>
    <text class="muted" x="632" y="1218">Polymorphic owner (not a direct FK)</text>
  </g>

  <!-- backup mappings -->
  <g>
    <rect class="table" x="1190" y="1160" width="600" height="120"/>
    <path class="head-slate" d="M1202 1160 H1778 Q1790 1160 1790 1172 V1204 H1190 V1172 Q1190 1160 1202 1160 Z"/>
    <text class="name" x="1212" y="1190">backup_import_mappings</text>
    <text class="field" x="1212" y="1230">PK id · backup_id · table_name · source_record_id · target_record_id</text>
    <text class="muted" x="1212" y="1260">Import deduplication/remapping; no FK constraints</text>
  </g>

  <!-- Workflow legend -->
  <rect class="flow" x="60" y="1240" width="970" height="58"/>
  <text class="flow-title" x="78" y="1265">Main data flow</text>
  <text class="flow-text" x="230" y="1265">Teacher creates referral</text>
  <path class="flow-arrow" d="M390 1260 H430"/>
  <text class="flow-text" x="445" y="1265">Student submits form</text>
  <path class="flow-arrow" d="M590 1260 H630"/>
  <text class="flow-text" x="645" y="1265">Guidance reviews / adds notes</text>
  <path class="flow-arrow" d="M850 1260 H890"/>
  <text class="flow-text" x="904" y="1265">Appointment / outcome</text>

  <text class="muted" x="60" y="1310">Only core product tables are shown. Laravel infrastructure tables (sessions, cache, jobs, password reset tokens, migrations) are omitted.</text>
</svg>
