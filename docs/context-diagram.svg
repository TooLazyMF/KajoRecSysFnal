<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" role="img" aria-labelledby="title desc">
  <title id="title">KajoRecSys Context Diagram</title>
  <desc id="desc">System context showing students, teachers, guidance counselors, administrators, and the KajoRecSys web platform interacting with database and file storage services.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 42px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .label { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .small { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .system { font: 800 26px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .role { font: 700 17px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .box-title { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .note { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1800" height="980" fill="#f8fafc"/>
  <rect x="0" y="0" width="1800" height="18" fill="#16a34a"/>

  <text x="90" y="90" class="title">KajoRecSys Context Diagram</text>
  <text x="90" y="120" class="subtitle">Role-based guidance and student support system</text>

  <g filter="url(#shadow)">
    <rect x="80" y="210" width="190" height="130" rx="18" fill="#ffffff" stroke="#dbe4f0"/>
    <rect x="80" y="390" width="190" height="130" rx="18" fill="#ffffff" stroke="#dbe4f0"/>
    <rect x="80" y="570" width="190" height="130" rx="18" fill="#ffffff" stroke="#dbe4f0"/>
    <rect x="80" y="750" width="190" height="130" rx="18" fill="#ffffff" stroke="#dbe4f0"/>

    <rect x="500" y="260" width="740" height="520" rx="24" fill="#ecfdf5" stroke="#86efac" stroke-width="3"/>

    <rect x="1350" y="250" width="320" height="210" rx="18" fill="#ffffff" stroke="#dbe4f0"/>
    <rect x="1350" y="540" width="320" height="200" rx="18" fill="#ffffff" stroke="#dbe4f0"/>
    <rect x="1350" y="770" width="320" height="120" rx="18" fill="#ffffff" stroke="#dbe4f0"/>
  </g>

  <g>
    <circle cx="175" cy="250" r="34" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="175" y="260" text-anchor="middle" class="role">S</text>
    <text x="175" y="330" text-anchor="middle" class="label">Student</text>
    <text x="175" y="352" text-anchor="middle" class="small">Requests forms</text>
    <text x="175" y="370" text-anchor="middle" class="small">Submits slips</text>

    <circle cx="175" cy="430" r="34" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="175" y="440" text-anchor="middle" class="role">T</text>
    <text x="175" y="500" text-anchor="middle" class="label">Teacher</text>
    <text x="175" y="522" text-anchor="middle" class="small">Assigns forms</text>
    <text x="175" y="540" text-anchor="middle" class="small">Tracks referrals</text>

    <circle cx="175" cy="610" r="34" fill="#f3e8ff" stroke="#7c3aed" stroke-width="3"/>
    <text x="175" y="620" text-anchor="middle" class="role">G</text>
    <text x="175" y="680" text-anchor="middle" class="label">Guidance</text>
    <text x="175" y="702" text-anchor="middle" class="small">Reviews workflows</text>
    <text x="175" y="720" text-anchor="middle" class="small">Schedules appointments</text>

    <circle cx="175" cy="790" r="34" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="175" y="800" text-anchor="middle" class="role">A</text>
    <text x="175" y="860" text-anchor="middle" class="label">Admin</text>
    <text x="175" y="882" text-anchor="middle" class="small">Manages users</text>
    <text x="175" y="900" text-anchor="middle" class="small">Runs backups</text>
  </g>

  <g>
    <text x="560" y="300" class="box-title">KajoRecSys</text>
    <text x="560" y="334" class="small">Laravel web application</text>

    <rect x="560" y="370" width="200" height="96" rx="14" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="660" y="405" text-anchor="middle" class="label">Authentication</text>
    <text x="660" y="432" text-anchor="middle" class="small">Login, OTP, roles, access</text>

    <rect x="790" y="370" width="220" height="96" rx="14" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="900" y="405" text-anchor="middle" class="label">Forms &amp; Slips</text>
    <text x="900" y="432" text-anchor="middle" class="small">Submission, approval, review</text>

    <rect x="1035" y="370" width="180" height="96" rx="14" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="1125" y="405" text-anchor="middle" class="label">Appointments</text>
    <text x="1125" y="432" text-anchor="middle" class="small">Referrals &amp; scheduling</text>

    <rect x="640" y="520" width="240" height="110" rx="14" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="760" y="553" text-anchor="middle" class="label">Student Records</text>
    <text x="760" y="578" text-anchor="middle" class="small">History, tracking, reporting</text>
    <text x="760" y="602" text-anchor="middle" class="small">Completed form visibility</text>

    <rect x="930" y="520" width="235" height="110" rx="14" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="1047" y="553" text-anchor="middle" class="label">Admin Operations</text>
    <text x="1047" y="578" text-anchor="middle" class="small">User management</text>
    <text x="1047" y="602" text-anchor="middle" class="small">Data backup &amp; import</text>
  </g>

  <g fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)">
    <path d="M270 275 L500 300"/>
    <path d="M270 430 L500 430"/>
    <path d="M270 610 L500 610"/>
    <path d="M270 790 L500 790"/>

    <path d="M1240 420 L1350 420"/>
    <path d="M1240 650 L1350 650"/>
    <path d="M1240 720 L1350 720"/>

    <path d="M1240 610 L1350 610"/>
    <path d="M1400 720 L1400 770"/>
  </g>

  <g>
    <text x="1400" y="295" text-anchor="middle" class="box-title">Email / OTP Service</text>
    <text x="1400" y="325" text-anchor="middle" class="small">Verification, password reset</text>
    <text x="1400" y="350" text-anchor="middle" class="small">Two-factor checks</text>
    <circle cx="1400" cy="410" r="45" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="1400" y="420" text-anchor="middle" class="label">Mail</text>

    <text x="1400" y="585" text-anchor="middle" class="box-title">Database</text>
    <text x="1400" y="615" text-anchor="middle" class="small">Users, roles, forms,</text>
    <text x="1400" y="640" text-anchor="middle" class="small">submission records,</text>
    <text x="1400" y="665" text-anchor="middle" class="small">appointments, referrals</text>
    <path d="M1390 700 L1500 700 L1500 725 L1390 725 Z" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
    <text x="1445" y="718" text-anchor="middle" class="small">data store</text>

    <text x="1400" y="815" text-anchor="middle" class="box-title">File Storage</text>
    <text x="1400" y="842" text-anchor="middle" class="small">Docs, images, PDFs,</text>
    <text x="1400" y="865" text-anchor="middle" class="small">attachments, evidence</text>
  </g>

  <g>
    <text x="700" y="830" class="note">The system keeps user activity, form data, records, and uploaded evidence in separate backend services.</text>
  </g>
</svg>
